apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-deployment
  template:
    metadata:
      labels:
        app: app-deployment
    spec:
      containers:
      - name: nginx-container
        image: nginx
        resources: 
          requests: 
              cpu: "100m"
              memory: "128Mi"
          limits:
              cpu: "500m"
              memory: "256Mi"